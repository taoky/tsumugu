envs:
  UPSTREAM: http://nodejs.org/dist/
  TSUMUGU_EXCLUDE: >
    --exclude /docs/
    --exclude /old-docs/
  # nodejs page mtime and actual mtime always does not match
  # only consider size for packages
  TSUMUGU_EXTRA: >
    --compare-size-only /node[^/]+$
image: ustcmirror/tsumugu:latest
cron: 7 7 * * *
logRotCycle: 10
name: node
storageDir: /srv/repo/node/
