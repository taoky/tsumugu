envs:
  UPSTREAM: https://packages.vyos.net/
  TSUMUGU_EXCLUDE: >
    --exclude [=/]tmp
    --exclude /legacy/
    --exclude /sagitta/
    --exclude /equuleus/
    --exclude /circinus/
  TSUMUGU_PARSER: nginx
image: ustcmirror/tsumugu:latest
#cron: 25 5 * * *
logRotCycle: 10
name: vyos
storageDir: /srv/repo/vyos
